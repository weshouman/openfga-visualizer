services:
  visualizer:
    build: .
    image: visualizer-integ-app
    container_name: visualizer-integ
    env_file:
      - .env
    environment:
      FLASK_RUN_HOST: "0.0.0.0"
      FLASK_RUN_PORT: "5000"
    ports:
      - "${VISUALIZER_HTTP_PORT:-5090}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
